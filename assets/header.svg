<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-label="OM Jyoti Prakash — Full Stack Developer">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b0f1a"/>
      <stop offset="100%" stop-color="#120f24"/>
    </linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#a78bfa"/>
      <stop offset="50%" stop-color="#f472b6"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>
    <radialGradient id="glowV" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowC" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.40"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowP" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ec4899" stop-opacity="0.40"/>
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1"/>
    </pattern>
    <style>
      .name { font-family: Georgia, 'Times New Roman', serif; font-size: 72px; font-weight: 500; fill: url(#brand); letter-spacing: -1px; }
      .role { font-family: 'SF Mono', Menlo, Consolas, monospace; font-size: 20px; fill: #22d3ee; letter-spacing: 4px; }
      .tag  { font-family: Georgia, 'Times New Roman', serif; font-style: italic; font-size: 22px; fill: #b4b0c8; }
      .meta { font-family: 'SF Mono', Menlo, Consolas, monospace; font-size: 14px; fill: #7a7694; letter-spacing: 1px; }
      .orb1 { animation: drift 14s ease-in-out infinite alternate; }
      .orb2 { animation: drift 18s ease-in-out infinite alternate-reverse; }
      .orb3 { animation: drift 22s ease-in-out infinite alternate; }
      .fade1 { animation: rise 1.1s ease-out 0.2s backwards; }
      .fade2 { animation: rise 1.1s ease-out 0.5s backwards; }
      .fade3 { animation: rise 1.1s ease-out 0.8s backwards; }
      .fade4 { animation: rise 1.1s ease-out 1.1s backwards; }
      .cursor { animation: blink 1.1s step-end infinite; }
      .ring { stroke-dasharray: 6 10; animation: spin 40s linear infinite; transform-origin: 1010px 170px; }
      @keyframes drift { from { transform: translate(0,0); } to { transform: translate(60px,-30px); } }
      @keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: translateY(0); } }
      @keyframes blink { 50% { opacity: 0; } }
      @keyframes spin { to { transform: rotate(360deg); } }
    </style>
  </defs>

  <rect width="1200" height="340" fill="url(#bg)"/>
  <rect width="1200" height="340" fill="url(#grid)"/>

  <g class="orb1"><circle cx="1000" cy="110" r="260" fill="url(#glowV)"/></g>
  <g class="orb2"><circle cx="140" cy="330" r="240" fill="url(#glowC)"/></g>
  <g class="orb3"><circle cx="620" cy="360" r="220" fill="url(#glowP)"/></g>

  <g class="ring" fill="none" stroke="url(#brand)" stroke-opacity="0.7" stroke-width="1.5">
    <circle cx="1010" cy="170" r="110"/>
  </g>
  <circle cx="1010" cy="170" r="78" fill="none" stroke="url(#brand)" stroke-opacity="0.4" stroke-width="1"/>
  <text x="1010" y="182" text-anchor="middle" font-family="Georgia, serif" font-size="34" fill="url(#brand)">{ }</text>

  <g class="fade1"><text class="role" x="80" y="118">FULL STACK DEVELOPER</text></g>
  <g class="fade2"><text class="name" x="78" y="196">OM Jyoti Prakash<tspan class="cursor" fill="#22d3ee">_</tspan></text></g>
  <g class="fade3"><text class="tag" x="80" y="240">I build software that makes complex things feel simple.</text></g>
  <g class="fade4"><text class="meta" x="80" y="286">BHUBANESWAR, INDIA  ·  FOUNDER @ QUICKNOTE  ·  OPEN TO WORK</text></g>

  <rect x="0" y="337" width="1200" height="3" fill="url(#brand)"/>
</svg>
